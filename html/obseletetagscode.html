<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Obsolete Tags Demo</title>
</head>

<body>

  <h1>HTML Obsolete Tags Demo 🏚️</h1>

  <!-- ❌ OBSOLETE: <center> used for alignment -->
  <!-- ✅ MODERN: use CSS text-align instead -->
  <p style="text-align:center; color:blue;">
    This is centered text (modern way)
  </p>

  <hr>

  <!-- ❌ OBSOLETE: <font> used for styling text -->
  <!-- ✅ MODERN: use CSS styles -->
  <p style="color:red; font-size:20px;">
    This is styled text without <font> tag
  </p>

  <hr>

  <!-- ❌ OBSOLETE: <strike> used for strikethrough -->
  <!-- ✅ MODERN: use <del> -->
  <p>
    Old Price: <del>₹500</del> New Price: ₹300
  </p>

  <hr>

  <!-- ❌ OBSOLETE: <tt> used for monospace text -->
  <!-- ✅ MODERN: use <code> -->
  <p>
    Code Example: <code>console.log("Hello")</code>
  </p>

  <hr>

  <!-- ❌ OBSOLETE: <big> increases text size -->
  <!-- ✅ MODERN: use CSS font-size -->
  <p style="font-size:24px;">
    This is bigger text using CSS
  </p>

  <hr>

  <!-- ❌ OBSOLETE: frameset is no longer used -->
  <!-- Modern websites use Flexbox/Grid instead -->

  <p>
    🚫 Frameset is completely outdated and not used in modern HTML.
  </p>

</body>
</
