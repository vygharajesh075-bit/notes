<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Page</title>
</head>
<!-- semantic tags = HTML tags with meaning

They don’t just show content… they describe what the content is.

👉 They help:

Browsers understand structure
Search engines rank better (SEO)
Developers read code easily
<body> -->

  <!-- Header -->
  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#">Home</a> |
      <a href="#">About</a> |
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Section 1 -->
    <section>
      <h2>About Me</h2>
      <p>I am learning web development 🚀</p>
    </section>

    <!-- Section 2 -->
    <section>
      <h2>Latest Posts</h2>

      <!-- Article 1 -->
      <article>
        <h3>Post 1</h3>
        <p>This is my first blog post.</p>
      </article>

      <!-- Article 2 -->
      <article>
        <h3>Post 2</h3>
        <p>This is my second blog post.</p>
      </article>

    </section>

  </main>

  <!-- Sidebar (optional) -->
  <aside>
    <h3>Quick Links</h3>
    <ul>
      <li><a href="#">HTML</a></li>
      <li><a href="#">CSS</a></li>
    </ul>
  </aside>

  <!-- Footer -->
  <footer>
    <p>© 2026 My Website</p>
  </footer>

</body>
</html>
