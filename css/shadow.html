<!-- 1. box-shadow (for elements)
🔹 Syntax
box-shadow: offset-x offset-y blur-radius spread-radius color;
🔹 Example
div {
  box-shadow: 5px 5px 10px 0px rgba(0,0,0,0.5);
}
🧠 Each Value Explained
Value	Meaning
offset-x	moves shadow left (-) or right (+)
offset-y	moves shadow up (-) or down (+)
blur-radius	softness (higher = smoother)
spread-radius	size of shadow
color	shadow color
🔥 Types of Shadows
1. Soft Shadow (Modern UI)
box-shadow: 0 4px 10px rgba(0,0,0,0.2);

✔ smooth
✔ natural
✔ used everywhere

2. Hard Shadow
box-shadow: 5px 5px 0 black;

✔ no blur
✔ sharp edges
✔ comic / bold style

3. Glow Effect ✨
box-shadow: 0 0 20px cyan;

✔ glowing
✔ neon style

4. Inner Shadow (Inset)
box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);

✔ shadow inside
✔ pressed button look

5. Multiple Shadows (🔥 Pro Level)
box-shadow: 
  0 2px 5px rgba(0,0,0,0.2),
  0 10px 20px rgba(0,0,0,0.15);

✔ layered depth
✔ premium feel

✍️ 2. text-shadow (for text)
🔹 Syntax
text-shadow: offset-x offset-y blur color;
🔹 Example
h1 {
  text-shadow: 2px 2px 5px black;
}
🔥 Text Effects
Glow Text
text-shadow: 0 0 10px cyan;
3D Text Look
text-shadow: 
  1px 1px 0 #000,
  2px 2px 0 #555;
⚡ Real Mini Example
<div class="card">Hello Shadow</div>

<style>
.card {
  width: 200px;
  padding: 20px;
  background: white;
  color: black;
  margin: 50px auto;

  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
</style>
💡 Golden Rules (very important)
Small blur → sharp shadow
Large blur → soft shadow
Dark color → heavy shadow
Multiple shadows → realistic depth
Use rgba() → for transparency -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Shadows Mastery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
}

/* TITLE TEXT SHADOW */
h1{
    margin:30px;
    font-size:40px;
    text-shadow: 0 0 10px cyan, 0 0 20px blue;
}

/* CONTAINER USING FLEX */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:20px;
}

/* COMMON CARD STYLE */
.card{
    width:200px;
    height:150px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:15px;
    font-weight:bold;
}

/* 1. SOFT SHADOW */
.soft{
    background:white;
    color:black;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* 2. HARD SHADOW */
.hard{
    background:#38bdf8;
    box-shadow: 8px 8px 0 black;
}

/* 3. GLOW EFFECT */
.glow{
    background:#020617;
    box-shadow: 0 0 20px cyan, 0 0 40px blue;
}

/* 4. INSET SHADOW */
.inset{
    background:#1e293b;
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
}

/* 5. MULTIPLE SHADOWS (PREMIUM LOOK) */
.multi{
    background:white;
    color:black;
    box-shadow: 
        0 2px 5px rgba(0,0,0,0.2),
        0 10px 20px rgba(0,0,0,0.15),
        0 20px 40px rgba(0,0,0,0.1);
}

/* BUTTON WITH HOVER SHADOW */
.btn{
    margin:40px;
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
    transition:0.3s;
}

.btn:hover{
    transform: translateY(-5px);
    box-shadow: 0 15px 25px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<h1>✨ CSS Shadows Showcase ✨</h1>

<div class="container">

    <div class="card soft">Soft Shadow</div>
    <div class="card hard">Hard Shadow</div>
    <div class="card glow">Glow</div>
    <div class="card inset">Inset</div>
    <div class="card multi">Layered</div>

</div>

<button class="btn">Hover Me 🚀</button>

</body>
</html>
