<!DOCTYPE html>
<html>
<head>
<style>

  font-size: 16px;
}

body {
  margin: 0;
}

.container {
  width: 80%;
  height: 100vh;
  background: lightblue;
}

  font-size: 3rem;
}

.box {
  width: 50vw;
  height: 20vh;
  background: coral;
  display:block;
  margin: auto;
}
</style>
</head>

<body>

<div class="container">
  <h1>CSS Units</h1>
  <div class="box"></div>
</div>

</body>
</html>
